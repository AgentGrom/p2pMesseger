[tool.poetry]
name = "p2p-messenger"
version = "0.1.0"
description = "Hybrid P2P messenger with E2EE"
authors = ["AgentGrom <nikita.hpybday@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.1"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
cryptography = "^42.0.0"
pynacl = "^1.5.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"